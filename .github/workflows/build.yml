name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an available simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; names=[dev['name'] for runtime in d for dev in d[runtime] if dev.get('isAvailable') and dev['name'].startswith('iPhone')]; print(names[0])")
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build (RoCheap app + extension, ad-hoc simulator signing)
        run: |
          xcodebuild \
            -project RoCheap.xcodeproj \
            -scheme RoCheap \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGN_IDENTITY="-" \
            build
