name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (RoCheap app + extension, unsigned, device SDK)
        run: |
          xcodebuild \
            -project RoCheap.xcodeproj \
            -scheme RoCheap \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Inspect embedded extension bundle on failure
        if: failure()
        run: |
          APPEX=$(find /Users/runner/Library/Developer/Xcode/DerivedData -type d -name "RoCheapExtension.appex" -path "*PlugIns*" | head -1)
          echo "Found: $APPEX"
          ls -la "$APPEX" || true
          echo "--- Info.plist (plutil -p) ---"
          plutil -p "$APPEX/Info.plist" || echo "plutil failed to read it"
          echo "--- file ---"
          file "$APPEX/Info.plist" || true
          echo "--- xxd head ---"
          xxd "$APPEX/Info.plist" | head -5 || true
